<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/style.css" />
    <title>Phaser - Template</title>
  </head>

  <body>
    <section id="prestart" class="hidden">
      <form id="connection">
        <label for="game-server-url">Game server URL:</label>
        <input type="text" name="game-server-url" />
      </form>
    </section>
    <div id="app">
      <div id="game-container"></div>
    </div>
    <div id="actions">
      <div class="left">
        <div id="mine">
          <img src="/public/assets/pickaxe.png" width="50" height="50" alt="" />
          mine
        </div>
      </div>
      <div class="right">
        <div id="miner">
          <img src="/public/assets/pickaxe.png" width="50" height="50" alt="" />
          <div class="name">miner</div>
          <div class="price">50</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
