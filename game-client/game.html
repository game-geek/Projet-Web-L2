<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/style.css" />
    <title>Phaser - Template</title>
  </head>

  <body>
    <div class="player-banner" id="playerBanner"></div>
    <div id="app">
      <div id="game-container"></div>
    </div>
    <div id="actions">
      <div class="left">
        <div id="mine">
          <img src="/public/assets/pickaxe.png" width="50" height="50" alt="" />
          mine
        </div>
      </div>
      <div class="right">
        <div id="miner">
          <img src="/public/assets/miner.png" width="50" height="50" alt="" />
          <div class="name">miner</div>
          <div class="price">50</div>
        </div>
        <div id="eliptae">
          <img src="/public/assets/eliptae.png" width="50" height="50" alt="" />
          <div class="name">eliptae</div>
          <div class="price">100</div>
        </div>
        <div id="turret">
          <img src="/public/assets/turret.png" width="50" height="50" alt="" />
          <div class="name">turret</div>
          <div class="price">200</div>
        </div>
        <div id="wall">
          <img src="/public/assets/wall.png" width="50" height="50" alt="" />
          <div class="name">wall</div>
          <div class="price">10</div>
        </div>
      </div>
    </div>
    <section id="echoPopup" class="popup hidden">
      <div class="popup-header">
        <div>
          <div class="title">echoes of the fractured core</div>
          <div class="subtitle">lobby signal synchronization</div>
        </div>
        <!-- <button class="close" type="button" id="echoClose">X</button> -->
      </div>

      <div class="popup-body">
        <div class="panel roster-panel">
          <div class="panel-label">other space kings...</div>
          <div id="playersGrid" class="players-grid"></div>
        </div>

        <div class="panel self-panel">
          <div>
            <div class="panel-label">your status</div>
            <div id="selfName" class="self-name">you</div>
            <div id="selfStatus" class="self-status">
              waiting for lobby data
            </div>

            <form id="readyForm">
              <div class="ready-row">
                <input id="isReady" name="isReady" type="checkbox" />
                <label class="ready-label" for="isReady">is ready</label>
              </div>
              <button
                type="submit"
                style="
                  margin-top: 0.85rem;
                  padding: 0.8rem 1rem;
                  border: 1px solid var(--accent);
                  background: transparent;
                  color: var(--accent-light);
                  text-transform: uppercase;
                  letter-spacing: 0.05em;
                  cursor: pointer;
                "
              >
                confirm
              </button>
            </form>
          </div>

          <div>
            <p class="hint">
              The game starts when at least 2 ready connected players are
              present.
            </p>
          </div>
        </div>
      </div>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
